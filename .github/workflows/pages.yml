          tests/director-readiness.test.mjs
          tests/director-camera-motion.test.mjs
          tests/observation-event-text.test.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

