name: Build and deploy ocean world

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check whole sea scenes, native entries and saved ecosystems
        run: >-
          node --test --test-concurrency=4
          tests/deep-midwater-life.test.mjs
          tests/deep-midwater-life-render.test.mjs
          tests/deep-midwater-life-ecology.test.mjs
          tests/deep-midwater-life-world.test.mjs
          tests/reef-valley-region.test.mjs
          tests/reef-valley-region-ecology.test.mjs
          tests/reef-valley-region-render.test.mjs
          tests/reef-valley-region-world.test.mjs
          tests/reef-valley-entry.test.mjs
          tests/living-coastal-seascape.test.mjs
          tests/living-coastal-seascape-ecology.test.mjs
          tests/living-coastal-seascape-render.test.mjs
          tests/living-coastal-seascape-world.test.mjs
          tests/kelp-understory-life.test.mjs
          tests/kelp-understory-life-render.test.mjs
          tests/kelp-understory-life-ecology.test.mjs
          tests/kelp-understory-life-world.test.mjs
          tests/kelp-near-bottom-life.test.mjs
          tests/kelp-near-bottom-life-render.test.mjs
          tests/kelp-near-bottom-life-ecology.test.mjs
          tests/kelp-near-bottom-life-world.test.mjs
          tests/kelp-water-life.test.mjs
          tests/kelp-water-life-render.test.mjs
          tests/kelp-water-life-ecology.test.mjs
          tests/kelp-water-life-world.test.mjs
          tests/ocean-shoal-life.test.mjs
          tests/ocean-shoal-life-render.test.mjs
          tests/ocean-shoal-life-ecology.test.mjs
          tests/ocean-shoal-life-world.test.mjs
          tests/ocean-meadow-life.test.mjs
          tests/ocean-meadow-life-render.test.mjs
          tests/ocean-meadow-life-ecology.test.mjs
          tests/ocean-meadow-life-world.test.mjs
          tests/deep-benthic-life.test.mjs
          tests/deep-benthic-life-render.test.mjs
          tests/deep-benthic-life-ecology.test.mjs
          tests/deep-benthic-life-world.test.mjs
          tests/deep-hard-life.test.mjs
