name: Build and deploy ocean world

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for native texture verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install native verification dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check built hosting artifacts
        run: node --test tests/sites-worker.test.mjs
      - name: Check frozen shallow sample and original image integrity
        run: npm run test:shallow
      - name: Check published product guide and asset paths
        run: npm run test:publication
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check entry navigation, packaged models and background integration
        run: node --test tests/entry-experience.test.mjs tests/ocean-background-runtime.test.mjs tests/stable-loading.test.mjs tests/stable-plan-validation.test.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  world-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check whole sea scenes, native entries and saved ecosystems
        run: node scripts/test-world-release.mjs ${{ matrix.shard }}

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: [build, world-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

