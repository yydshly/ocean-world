name: Build and deploy ocean world

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check current seascape and hosting integration
        run: >-
          node --test
          tests/living-seascape.test.mjs
          tests/living-seascape-render.test.mjs
          tests/living-seascape-ecology.test.mjs
          tests/living-shallows-world.test.mjs
          tests/sites-worker.test.mjs
          tests/demo-navigation.test.mjs
          tests/director-tour.test.mjs
          tests/director-player.test.mjs
          tests/director-readiness.test.mjs
          tests/director-camera-motion.test.mjs
          tests/observation-event-text.test.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

